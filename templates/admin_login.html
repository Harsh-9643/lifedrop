<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — LifeDrop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">💧 LifeDrop</div>
      <h2>Admin Panel</h2>
      <p class="login-sub">Secure access only</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="admin-flash admin-flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin_login') }}" class="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="Admin username" required autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••••" required>
        </div>
        <button type="submit" class="btn-admin-login">Login to Dashboard →</button>
      </form>
      <p class="login-back"><a href="{{ url_for('index') }}">← Back to website</a></p>
    </div>
  </div>
</body>
</html>
